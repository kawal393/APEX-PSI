    <script>
      // Legacy origins can be pinned to a stale cached shell by an old service
      // worker. Drop that state and move the visitor to the canonical domain.
      (function () {
        if (location.hostname.indexOf('apex-infrastructure.com') < 0) return;
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              rs.forEach(function (r) { r.unregister(); });
            });
          }
          if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
        } catch (e) { /* non-fatal */ }
        var q = location.search ? location.search + '&' : '?';
        location.replace('https://www.ai-governance-standard.com' + location.pathname + q + 'v=' + Date.now() + location.hash);
      })();
    </script>

    <script>
      // One release cycle: load the replacement worker so it can clear stale
      // caches and unregister itself. No new offline caching is registered.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations().then((regs) => {
            if (regs.length) navigator.serviceWorker.register('/sw.js').catch(() => {});
          });
        });
      }
    </script>
