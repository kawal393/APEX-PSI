[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psi-verifier"
version = "1.1.1"
description = "MIT-licensed verifier for the PSI-SEAL/1 canonical seal schema. Verification is free forever; enforcement is on by default."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "APEX Infrastructure" }]
keywords = ["psi", "apex", "verification", "ai-governance", "eu-ai-act", "sha256", "merkle"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Intended Audience :: Developers",
]
dependencies = []

[project.urls]
Homepage = "https://ai-governance-standard.com/license"
Specification = "https://ai-governance-standard.com/spec"
Schema = "https://ai-governance-standard.com/.well-known/psi-schema.json"

[tool.setuptools]
packages = ["psi_verifier"]
