[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psi-verifier"
version = "1.6.0"
description = "MIT-licensed verifier for the PSI-SEAL/1 canonical seal schema. Verification is free forever; enforcement is on by default, rule R11 (Ed25519 over the ASCII seal_hash) is actually checked against caller-supplied public keys, R11.6 makes a signature name the digest it authenticates, R13.1 verifies an RFC 9162 inclusion proof by walking the tree's split, and R13.2 verifies an RFC 9162 consistency proof between two tree heads, which is what proves the log never forgot a receipt."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "APEX Infrastructure" }]
keywords = ["psi", "apex", "verification", "ai-governance", "eu-ai-act", "sha256", "merkle"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
# R11 authenticity checks need one Ed25519 primitive. Without it the verifier
# still installs and still runs — it reports `unverifiable` for every signature
# rather than assuming a pass. `pip install psi-verifier[signature]` to check.
signature = ["cryptography>=41"]

[project.urls]
Homepage = "https://ai-governance-standard.com/license"
Specification = "https://ai-governance-standard.com/spec"
Schema = "https://ai-governance-standard.com/.well-known/psi-schema.json"

[tool.setuptools]
packages = ["psi_verifier"]
