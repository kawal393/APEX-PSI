name: Deprecate superseded apex-psi-verifier releases

# Same rail as publish-node.yml: npm verifies this workflow by its OpenID Connect
# identity, so no token exists on any machine to leak. The versions below are
# named explicitly - the workflow never deprecates anything it was not told to.
#
# It fires on a tag, so it can be run without a GitHub API token:
#   git tag deprecate-apex-psi-verifier-2026-11-14
#   git push origin deprecate-apex-psi-verifier-2026-11-14
#
# A deprecation is a machine-readable label on a release. Without it, a known
# defective version stays installable and the only warning a stranger gets is
# in the words of whoever happens to remember the defect.
on:
  workflow_dispatch:
  push:
    tags:
      - "deprecate-apex-psi-verifier-*"

permissions:
  contents: read
  id-token: write # required for npm trusted publishing

jobs:
  deprecate:
    runs-on: ubuntu-latest
    # Must match the "Environment name" field on the npm trusted-publisher form.
    environment: npm
    defaults:
      run:
        working-directory: packages/psi-verifier
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Each line says what is true of that release and nothing more. A release
      # that is merely superseded says so; a release that skips a security check
      # says that.
      - name: Deprecate the named releases
        run: |
          set -euo pipefail
          ENTRIES=(
            "0.0.0-stage|Temporary publishing placeholder, not a release. Install apex-psi-verifier@1.6.0."
            "1.2.0|Security advisory: this release does not verify the seal's Ed25519 signature. Upgrade to 1.6.0."
            "1.3.0|Security advisory: this release reports a declared post-quantum signature as verified without checking it. Upgrade to 1.6.0."
            "1.5.0|Superseded by 1.6.0, which adds RFC 9162 consistency-proof verification (R13.2)."
          )
          for ENTRY in "${ENTRIES[@]}"; do
            VERSION="${ENTRY%%|*}"
            MESSAGE="${ENTRY#*|}"
            echo "deprecating $VERSION"
            npm deprecate "apex-psi-verifier@$VERSION" "$MESSAGE"
          done

      # A guard that cannot fail is not a guard: read the registry back and prove
      # the labels are actually there.
      - name: The registry must now carry the labels
        run: |
          node -e "
          const https = require('https');
          const want = ['0.0.0-stage', '1.2.0', '1.3.0', '1.5.0'];
          https.get('https://registry.npmjs.org/apex-psi-verifier', (r) => {
            let body = '';
            r.on('data', (c) => { body += c; });
            r.on('end', () => {
              const d = JSON.parse(body);
              const labelled = want.filter((v) => d.versions[v] && d.versions[v].deprecated);
              const missing = want.filter((v) => !d.versions[v] || !d.versions[v].deprecated);
              console.log('deprecated now:', labelled.join(', ') || '(none)');
              for (const v of labelled) console.log('  ', v, '->', d.versions[v].deprecated);
              if (missing.length) {
                console.error('STILL UNLABELLED:', missing.join(', '));
                process.exit(1);
              }
            });
          });
          "
