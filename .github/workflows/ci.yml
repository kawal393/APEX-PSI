name: CI/CD — apex-psi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      only_functions:
        description: "Deploy only these functions, space-separated (e.g. trust-anchor). Empty deploys every function in the repo."
        required: false
        default: ""

# One deploy at a time, and never two production pushes racing each other.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # This repository shipped a tracked .env from 28 Feb 2026 to 18 Oct 2026. Measured on
  # 18 Oct, that file held three values -- project id, publishable key and URL -- and the
  # publishable key is public by design; a `git log -S` pickaxe over every ref **in this
  # repository** finds no commit that ever contained a Stripe secret key. So this job guards
  # a class of mistake here, not an admitted incident in this tree. It stays because the next
  # builder can make one. The scanner
  # never prints a matched value -- only file, line number and pattern name -- so the build
  # log cannot become the second leak.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: .env must never be tracked again
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked again — untrack it with `git rm --cached .env` and rotate whatever it holds"
            exit 1
          fi
          echo ".env is not tracked."
      - run: node scripts/secret-scan.mjs
      # The guard is tested too: a scanner that silently stops matching is worse than none,
      # because everyone believes the green tick. Synthetic tokens only, printed as nothing.
      - run: node scripts/check-secret-scan-jwt.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # -p tsconfig.app.json is required: the root tsconfig has "files": [] and only
      # references, so a bare `tsc --noEmit` type-checks nothing and always exits 0.
      - run: npx tsc -p tsconfig.app.json --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Hermetic by design. The live-ledger tests in src/test/pipeline.test.ts
      # write real, signed rows into the production ledger, so they are skipped
      # unless APEX_LIVE=1 is passed deliberately.
      - run: npm run test -- --run

  # A paywall that has never been refused is a way of losing money, not making it.
  # This job runs the door's own refusals against the module the notary imports:
  # exact scheme only, price taken from our configuration and never from the caller,
  # one signed authorization buys one receipt, and a tampered payload is refused
  # before a facilitator call is spent.
  x402-door:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:x402

  # The hosted door is the surface that asks for no account, so its answers are
  # the contract an agent reads. This job drives the shipped function's own
  # modules under plain Node and fails if the stateless transport, the five tool
  # names, the notary's refusal codes, or a chain verdict drift from what the
  # npm server does. It reaches no network and mints nothing.
  hosted-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:hosted-mcp

  # Two AI builders shipped a "1.3.0 signature fix" to this repository on
  # 17 Oct 2026 within hours of each other, with different rule numbers and
  # different verdict shapes. This job is what stops that happening again: the
  # TypeScript and Python distributions must print byte-identical verdicts, and
  # both must claim the same version.
  verifier-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: python -m pip install --upgrade pip cryptography
      - run: npm test -- --run
        working-directory: packages/psi-verifier
      - run: npm run test:cross-language
        working-directory: packages/psi-verifier
      - name: The Python distribution must run its own consistency proof suite
        run: python packages/psi-verifier-py/test/consistency_proof_test.py
      - name: TS and Python versions must agree
        run: |
          ts=$(node -p "require('./packages/psi-verifier/package.json').version")
          py=$(python -c "import re;print(re.search(r'^version = \"([^\"]+)\"', open('packages/psi-verifier-py/pyproject.toml').read(), re.M).group(1))")
          echo "npm package: $ts   pyproject: $py"
          if [ "$ts" != "$py" ]; then
            echo "::error::the two free verifiers advertise different versions — publish them together or not at all"
            exit 1
          fi
      - name: The npm package name must be the one that is actually published
        run: |
          name=$(node -p "require('./packages/psi-verifier/package.json').name")
          echo "declared name: $name"
          if [ "$name" != "apex-psi-verifier" ]; then
            echo "::error::npm name drifted to $name; the published package is apex-psi-verifier and strangers install that one"
            exit 1
          fi

  # 18 Oct 2026: a bot commit added a 6.3 MB WebAssembly binary to public/wasm and
  # the reader page started loading it from there. A vendored binary is only honest
  # while it is still the bytes upstream published, and no build step or future bot
  # is going to notice if it stops being them. This job is that notice.
  wasm-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/wasm-provenance.mjs

  # What the public says is part of the build. live-copy-check.mjs can only read the served
  # bundle after Lovable publishes, so between a commit and a publish the tree is unwatched —
  # and on 23 Oct the badge page shipped a "PSI Verified" mark anyone could download without
  # sealing anything, plus a "real-time score" no code computes. This job refuses those
  # phrases before they reach the repository, not after they reach the world.
  public-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/badge-copy-check.mjs
      - name: Refuse a page wrapper that kills its own sticky bar
        # `overflow-x: hidden` on the wrapper makes it a scroll container, so the
        # navigation bar — which is `sticky` — resolves against the wrapper and
        # scrolls away with the page. Measured 16 Nov 2026 against the live
        # site in headless Chrome: after 1200px the nav bar's top sat at -1114
        # and nothing was on screen. The fix was written on a laptop branch on
        # 3 Oct 2026 and never reached the published tree, so nothing caught it.
        run: node scripts/sticky-nav-check.mjs
      - name: Refuse to advertise a tool the server does not answer
        # APEX PSI runs two MCP servers over one ledger — the npm package (stdio, 5 tools, no
        # account) and the hosted connector (streamable-http, 6 tools, OAuth). Until 23 Oct our
        # /mcp page printed them as one list, and a third-party directory copied the mixture onto
        # a listing that carries our version number. An agent that installed `apex-psi-mcp` and
        # called verify_hash got "unknown tool" from a page graded Grade A. A page an agent reads
        # is an interface, so it is guarded like one.
        run: node scripts/tool-name-check.mjs

  # A draft the registry's own checker refuses never gets filed. On 15 Nov 2026
  # the datatracker rejected draft-singh-psi-agent-02 for two reasons the
  # checker named: the License Notice was two paragraphs where the IETF Trust
  # provisions want one, and the file carried no page furniture, so the expiry
  # date was missing from the last page. This job rebuilds the upload artifact
  # from the source draft and refuses a stale one, so the bytes we upload are
  # the bytes we measured.
  ietf-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:ietf-draft
      # The layout check asks whether the bytes are well formed. This one asks
      # whether the words are right: every reference matches the RFC Editor's
      # record, every "Section N" resolves, every reason code is used, every
      # claim about the published -01 and Merkle drafts is true of them, and
      # the author address carries the label the author chose. The filed -02
      # shipped four citation defects and a URI label that no layout check
      # could see.
      - run: npm run check:ietf-audit

  # Own job, nothing depends on it: it measures a third party's cached record, so it can be red
  # because the registry has not refreshed while our own repository is already correct — and it
  # must never hold the deploy rail hostage to someone else's cache.
  # 11 Nov 2026: our site asserted "mcprush Grade A · 100/100 trust" in a stat tile, a strip, a
  # button and two sentences. mcprush's badge, fetched live, publishes "security A, low access,
  # no sign-in, 6 tools, works with 14 clients" — a letter and four findings, and no score out of
  # 100 anywhere in it. A borrowed number is a claim about somebody else, so it is measured
  # against them, not against what we remember being told.
  registry-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:registry-truth

  # A deprecation is a machine-readable label on a release. Without it, 1.2.0 and
  # 1.3.0 stay installable and the only warning a stranger gets is in the words
  # of whoever happens to remember the defect. The labels are written once, by
  # scripts/npm-label-old-releases.mjs, because npm's token-free session cannot
  # write a label onto an existing release; anyone who can write to the package
  # can also remove them. So the registry is read back and compared with
  # packages/psi-verifier/deprecation-notices.json on every push.
  registry-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:registry-labels

  # The verifier is what a stranger installs. So the guard installs what the
  # indexes serve and drives the attacks through those bytes: the hash forgery,
  # the genuine seal wearing a fabricated post-quantum claim, and — since 1.6.0
  # — the split view, where an operator holding the log shows one client a tree
  # and another client a different tree at the same moment. The 1.2.0 and 1.3.0
  # artifacts are installed alongside as the demonstrated failure cases, so the
  # guard cannot go blind by passing everything.
  #
  # Own job, nothing depends on it: it reads two third-party indexes, so it can
  # be red while this repository is already correct. It must never hold the
  # deploy rail hostage to somebody else's cache.
  verifier-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm run check:verifier-truth

  # The 15-second drop-in is a promise to a stranger: install one package and
  # check a receipt. This job proves the promise against the PUBLIC registries
  # — the published npm package, the published PyPI package and the published
  # MCP door — and not against this source tree, which is the only way the
  # promise can fail without anyone noticing.
  #
  # Own job, nothing depends on it: it measures three third-party indexes, so
  # it can be red because a registry is slow while this repository is already
  # correct. It must never hold the deploy rail hostage to somebody else's
  # cache.
  drop-in:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm run check:drop-in

  # The copy names a version. The registries decide which version that is. On 13 Nov 2026
  # six public surfaces still told a stranger to install 1.5.0 while both registries were
  # serving 1.6.0, and the README told them to install 1.3.0 — a release that checks no
  # signature at all. This job reads the registries and refuses any install line, pin
  # instruction or published-version claim in our own copy that disagrees with them.
  #
  # Own job, nothing depends on it: it reads two third-party indexes, so it can be red
  # while this repository is already correct. It must never hold the deploy rail hostage
  # to somebody else's cache.
  version-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:version-truth

  # The 1,000 published articles are read at runtime by the site's own /articles page and
  # were written in a batch by a generator nobody re-reads. On 15 Nov 2026 a read of every
  # published row found 505 banned claims still live — "cryptographic truth", "tamper-proof",
  # "irrefutable" and friends — and 33 URLs carrying one of those words. This job reads the
  # public rows with the public anon key, so it needs no secret and measures the table the
  # public reads.
  #
  # continue-on-error: the corpus is still wrong and the correction needs a service_role
  # key for the live project, which this repository does not hold. The job stays visible
  # so the debt is on the board; it is removed the day the corpus is corrected.
  # The words on our own pages are a claim. On 16 Nov 2026 a critique read "black box
  # recorder", "the world's first" and "3-node MPC" against their literal meaning and the
  # claim did not survive: a black box is hardware an operator cannot bypass, and our three
  # verifier nodes are operated by one company. The copy was corrected and this guard was
  # written in the same turn, so the correction cannot rot back into a metaphor.
  #
  # It reads only this repository and never the network, so it belongs on the blocking rail.
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:claims
      # A guard that cannot fail is not a guard: prove it bites on each shape it closes.
      - run: npm run check:claims:selftest

  article-claims:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:article-claims

  # The trust anchor is the product's one trust claim: a signature that verifies
  # against the published key proves the named key signed the record. Measured on
  # 15 Nov 2026, the published anchor verified live ledger signatures whose seed was
  # the SUPABASE_SERVICE_ROLE_KEY — a database login, not a signing identity. Whoever
  # held that credential could mint a receipt that verifies against our own anchor.
  # The signing seed now has a secret of its own (APEX_PSI_ED25519_SEED), and this job
  # refuses any signing path that goes back to the database credential, or any anchor
  # that a credential on the machine can derive. It reads no secret and no network,
  # so it can hold the deploy rail.
  trust-anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:trust-anchor
      - name: The trust anchor must be readable from another origin
        # Measured 17 Nov 2026: the published anchor came back with no
        # Access-Control-Allow-Origin, so a verifier running in someone else's
        # browser could not fetch it and failed closed for a reason that had
        # nothing to do with the signature. This job refuses an anchor that is
        # unreachable cross-origin, and refuses a second copy of the anchor
        # bytes: one document, one source of truth.
        run: npm run check:anchor-cors

  supabase-deploy:
    # NOT on every push to main. `supabase db push` + `functions deploy` mutate
    # production, and the deploy job used to run silently behind a test suite
    # that called the same production endpoints. Publishing to production is now
    # a human decision: run this workflow from the Actions tab (or protect the
    # `production` environment with required reviewers in repo settings).
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: [secret-scan, lint, typecheck, test, verifier-parity, wasm-provenance, public-copy, trust-anchor, ietf-draft, hosted-mcp]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to deploy a stubbed MCP server
        # 18 Oct 2026: building this site with `vite build` on a machine that has
        # no `bunx` rewrote supabase/functions/mcp/index.ts from 297 lines to a
        # 5-line stub. A green test suite did not notice. If that ever reaches a
        # deploy, the public MCP endpoint goes silent while looking fine.
        run: |
          lines=$(wc -l < supabase/functions/mcp/index.ts)
          echo "supabase/functions/mcp/index.ts: $lines lines"
          if [ "$lines" -lt 100 ]; then
            echo "::error::the MCP edge function is a stub ($lines lines) — refusing to deploy an empty protocol endpoint"
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # 7 Nov 2026: this job has never deployed. Both dispatch runs (#269 5 Nov, #278 7 Nov)
      # died on the link step and the step name rendered as `--project-ref ` — blank. The
      # project ref lived only in an Actions *variable* nobody ever set, so GitHub served an
      # empty argument. The ref is already in the repo (supabase/config.toml), which is the
      # copy the CLI itself reads locally, so it is the source of record here too. An unset
      # variable is now an override, not a requirement, and both possible causes — no ref, no
      # token — name themselves before the CLI is asked to guess.
      - name: Resolve the project ref and refuse to fail silently
        run: |
          ref=$(node -e 'const t=require("fs").readFileSync("supabase/config.toml","utf8");
            const m=t.match(/^project_id[^\S\n]*=[^\S\n]*"([^"]+)"/m); if(m) console.log(m[1]);')
          echo "SUPABASE_PROJECT_REF=${SUPABASE_PROJECT_ID:-$ref}" >> "$GITHUB_ENV"
          if [ -z "${SUPABASE_PROJECT_REF:-$ref}" ]; then
            echo "::error::no project ref: supabase/config.toml has no project_id and the SUPABASE_PROJECT_ID variable is empty"
            exit 1
          fi
          echo "project ref: $ref"
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is absent or empty. Supabase personal access tokens expire (the dashboard mints 7-day ones by default), so an expired key reads here as a missing key. Mint a new one at https://supabase.com/dashboard/account/tokens and replace the secret — no code change is needed."
            exit 1
          fi
          echo "access token: present"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Apply migrations (needs the database password, which we deliberately do not hold)
        # `supabase db push` opens a direct Postgres connection, so it wants the database
        # password, not the API token. The password is Master's and stays his — putting it in
        # Actions would make every CI runner root of the production ledger. So this step names
        # the two ways the migration gets applied and never fails with an unexplained red X:
        # either the DB_PASSWORD secret is provided, or the migration file is run in the
        # dashboard's SQL editor (scripts are idempotent: IF NOT EXISTS / OR REPLACE).
        continue-on-error: true
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::migrations were NOT applied by this run. supabase db push needs the database password, which this repository does not store. Apply the pending files under supabase/migrations in https://supabase.com/dashboard/project/$SUPABASE_PROJECT_REF/sql/new — or add a repository secret named SUPABASE_DB_PASSWORD if you accept a CI runner holding root over the ledger."
            echo "pending migrations:"
            ls supabase/migrations | sed 's/^/  /'
            exit 0
          fi
          supabase db push --project-ref "$SUPABASE_PROJECT_REF" --db-password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Deploy functions
        # A whole-directory deploy overwrites every live function with this repo's
        # copy. When one function is being shipped, name it: the scope of the blast
        # radius should be the size of the change.
        run: |
          case "$DEPLOY_ONLY" in
            *[!A-Za-z0-9._ -]*)
              echo "::error::only_functions may hold function names only (letters, digits, dot, dash, underscore, space); got: $DEPLOY_ONLY"
              exit 1 ;;
          esac
          if [ -n "$DEPLOY_ONLY" ]; then
            # shellcheck disable=SC2086
            supabase functions deploy $DEPLOY_ONLY --project-ref "$SUPABASE_PROJECT_REF"
          else
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DEPLOY_ONLY: ${{ github.event.inputs.only_functions }}
