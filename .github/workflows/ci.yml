name: CI/CD — apex-psi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never two production pushes racing each other.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # This repository shipped a tracked .env from 28 Feb 2026 to 18 Oct 2026. Measured on
  # 18 Oct, that file held three values -- project id, publishable key and URL -- and the
  # publishable key is public by design; a `git log -S` pickaxe over every ref **in this
  # repository** finds no commit that ever contained a Stripe secret key. So this job guards
  # a class of mistake here, not an admitted incident in this tree. It stays because the next
  # builder can make one. The scanner
  # never prints a matched value -- only file, line number and pattern name -- so the build
  # log cannot become the second leak.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: .env must never be tracked again
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked again — untrack it with `git rm --cached .env` and rotate whatever it holds"
            exit 1
          fi
          echo ".env is not tracked."
      - run: node scripts/secret-scan.mjs
      # The guard is tested too: a scanner that silently stops matching is worse than none,
      # because everyone believes the green tick. Synthetic tokens only, printed as nothing.
      - run: node scripts/check-secret-scan-jwt.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # -p tsconfig.app.json is required: the root tsconfig has "files": [] and only
      # references, so a bare `tsc --noEmit` type-checks nothing and always exits 0.
      - run: npx tsc -p tsconfig.app.json --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Hermetic by design. The live-ledger tests in src/test/pipeline.test.ts
      # write real, signed rows into the production ledger, so they are skipped
      # unless APEX_LIVE=1 is passed deliberately.
      - run: npm run test -- --run

  # A paywall that has never been refused is a way of losing money, not making it.
  # This job runs the door's own refusals against the module the notary imports:
  # exact scheme only, price taken from our configuration and never from the caller,
  # one signed authorization buys one receipt, and a tampered payload is refused
  # before a facilitator call is spent.
  x402-door:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:x402

  # Two AI builders shipped a "1.3.0 signature fix" to this repository on
  # 17 Oct 2026 within hours of each other, with different rule numbers and
  # different verdict shapes. This job is what stops that happening again: the
  # TypeScript and Python distributions must print byte-identical verdicts, and
  # both must claim the same version.
  verifier-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: python -m pip install --upgrade pip cryptography
      - run: npm test -- --run
        working-directory: packages/psi-verifier
      - run: npm run test:cross-language
        working-directory: packages/psi-verifier
      - name: TS and Python versions must agree
        run: |
          ts=$(node -p "require('./packages/psi-verifier/package.json').version")
          py=$(python -c "import re;print(re.search(r'^version = \"([^\"]+)\"', open('packages/psi-verifier-py/pyproject.toml').read(), re.M).group(1))")
          echo "npm package: $ts   pyproject: $py"
          if [ "$ts" != "$py" ]; then
            echo "::error::the two free verifiers advertise different versions — publish them together or not at all"
            exit 1
          fi
      - name: The npm package name must be the one that is actually published
        run: |
          name=$(node -p "require('./packages/psi-verifier/package.json').name")
          echo "declared name: $name"
          if [ "$name" != "apex-psi-verifier" ]; then
            echo "::error::npm name drifted to $name; the published package is apex-psi-verifier and strangers install that one"
            exit 1
          fi

  # 18 Oct 2026: a bot commit added a 6.3 MB WebAssembly binary to public/wasm and
  # the reader page started loading it from there. A vendored binary is only honest
  # while it is still the bytes upstream published, and no build step or future bot
  # is going to notice if it stops being them. This job is that notice.
  wasm-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/wasm-provenance.mjs

  # What the public says is part of the build. live-copy-check.mjs can only read the served
  # bundle after Lovable publishes, so between a commit and a publish the tree is unwatched —
  # and on 23 Oct the badge page shipped a "PSI Verified" mark anyone could download without
  # sealing anything, plus a "real-time score" no code computes. This job refuses those
  # phrases before they reach the repository, not after they reach the world.
  public-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/badge-copy-check.mjs
      - name: Refuse to advertise a tool the server does not answer
        # APEX PSI runs two MCP servers over one ledger — the npm package (stdio, 5 tools, no
        # account) and the hosted connector (streamable-http, 6 tools, OAuth). Until 23 Oct our
        # /mcp page printed them as one list, and a third-party directory copied the mixture onto
        # a listing that carries our version number. An agent that installed `apex-psi-mcp` and
        # called verify_hash got "unknown tool" from a page graded Grade A. A page an agent reads
        # is an interface, so it is guarded like one.
        run: node scripts/tool-name-check.mjs

  # Own job, nothing depends on it: it measures a third party's cached record, so it can be red
  # because the registry has not refreshed while our own repository is already correct — and it
  # must never hold the deploy rail hostage to someone else's cache.
  # 11 Nov 2026: our site asserted "mcprush Grade A · 100/100 trust" in a stat tile, a strip, a
  # button and two sentences. mcprush's badge, fetched live, publishes "security A, low access,
  # no sign-in, 6 tools, works with 14 clients" — a letter and four findings, and no score out of
  # 100 anywhere in it. A borrowed number is a claim about somebody else, so it is measured
  # against them, not against what we remember being told.
  registry-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:registry-truth

  supabase-deploy:
    # NOT on every push to main. `supabase db push` + `functions deploy` mutate
    # production, and the deploy job used to run silently behind a test suite
    # that called the same production endpoints. Publishing to production is now
    # a human decision: run this workflow from the Actions tab (or protect the
    # `production` environment with required reviewers in repo settings).
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: [secret-scan, lint, typecheck, test, verifier-parity, wasm-provenance, public-copy]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to deploy a stubbed MCP server
        # 18 Oct 2026: building this site with `vite build` on a machine that has
        # no `bunx` rewrote supabase/functions/mcp/index.ts from 297 lines to a
        # 5-line stub. A green test suite did not notice. If that ever reaches a
        # deploy, the public MCP endpoint goes silent while looking fine.
        run: |
          lines=$(wc -l < supabase/functions/mcp/index.ts)
          echo "supabase/functions/mcp/index.ts: $lines lines"
          if [ "$lines" -lt 100 ]; then
            echo "::error::the MCP edge function is a stub ($lines lines) — refusing to deploy an empty protocol endpoint"
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # 7 Nov 2026: this job has never deployed. Both dispatch runs (#269 5 Nov, #278 7 Nov)
      # died on the link step and the step name rendered as `--project-ref ` — blank. The
      # project ref lived only in an Actions *variable* nobody ever set, so GitHub served an
      # empty argument. The ref is already in the repo (supabase/config.toml), which is the
      # copy the CLI itself reads locally, so it is the source of record here too. An unset
      # variable is now an override, not a requirement, and both possible causes — no ref, no
      # token — name themselves before the CLI is asked to guess.
      - name: Resolve the project ref and refuse to fail silently
        run: |
          ref=$(node -e 'const t=require("fs").readFileSync("supabase/config.toml","utf8");
            const m=t.match(/^project_id[^\S\n]*=[^\S\n]*"([^"]+)"/m); if(m) console.log(m[1]);')
          echo "SUPABASE_PROJECT_REF=${SUPABASE_PROJECT_ID:-$ref}" >> "$GITHUB_ENV"
          if [ -z "${SUPABASE_PROJECT_REF:-$ref}" ]; then
            echo "::error::no project ref: supabase/config.toml has no project_id and the SUPABASE_PROJECT_ID variable is empty"
            exit 1
          fi
          echo "project ref: $ref"
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is absent or empty. Supabase personal access tokens expire (the dashboard mints 7-day ones by default), so an expired key reads here as a missing key. Mint a new one at https://supabase.com/dashboard/account/tokens and replace the secret — no code change is needed."
            exit 1
          fi
          echo "access token: present"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Apply migrations (needs the database password, which we deliberately do not hold)
        # `supabase db push` opens a direct Postgres connection, so it wants the database
        # password, not the API token. The password is Master's and stays his — putting it in
        # Actions would make every CI runner root of the production ledger. So this step names
        # the two ways the migration gets applied and never fails with an unexplained red X:
        # either the DB_PASSWORD secret is provided, or the migration file is run in the
        # dashboard's SQL editor (scripts are idempotent: IF NOT EXISTS / OR REPLACE).
        continue-on-error: true
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::migrations were NOT applied by this run. supabase db push needs the database password, which this repository does not store. Apply the pending files under supabase/migrations in https://supabase.com/dashboard/project/$SUPABASE_PROJECT_REF/sql/new — or add a repository secret named SUPABASE_DB_PASSWORD if you accept a CI runner holding root over the ledger."
            echo "pending migrations:"
            ls supabase/migrations | sed 's/^/  /'
            exit 0
          fi
          supabase db push --project-ref "$SUPABASE_PROJECT_REF" --db-password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
