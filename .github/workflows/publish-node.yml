name: Publish apex-psi-verifier to npm

# Same design as publish-python.yml: npm verifies this workflow by its OpenID Connect
# identity, so there is no token on disk or in secrets to leak.
#
# npm's trusted publishing requires npm CLI >= 11.5.1 and Node >= 22.14.0, which is why
# this job does not reuse CI's node 20 image. It is also why publishing must happen here
# and not from a laptop: the OIDC identity only exists inside a CI run.
#
# Fires on a version tag:  git tag apex-psi-verifier-v1.3.0 && git push origin apex-psi-verifier-v1.3.0
# and can also be started by hand from the Actions tab.
#
# The same file also carries the `deprecate` job, which fires on a
# deprecate-apex-psi-verifier-* tag. It has to live HERE: npm's trusted
# publisher is registered against this workflow's filename, so no other
# workflow file can mint a package session.
on:
  workflow_dispatch:
  push:
    tags:
      - "apex-psi-verifier-v*"
      - "deprecate-apex-psi-verifier-*"

permissions:
  contents: read
  id-token: write # required for npm trusted publishing

jobs:
  publish:
    # A deprecate-* tag must not try to publish anything.
    if: startsWith(github.ref_name, 'apex-psi-verifier-v')
    runs-on: ubuntu-latest
    # Must match the "Environment name" field on the npm trusted-publisher form.
    environment: npm
    defaults:
      run:
        working-directory: packages/psi-verifier
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Set the version for later steps
        run: echo "PKG=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # The published package must be the one CI already proved. If the tag and the
      # manifest disagree, stop rather than ship a surprise release.
      - name: Tag and package.json version must agree
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#apex-psi-verifier-v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag says $TAG, package.json says $PKG"
          test "$TAG" = "$PKG" || { echo "STOP: tag and package.json disagree"; exit 1; }

      # The verifier package is standalone and has no lockfile of its own; the root
      # lockfile does not contain tsup, so install inside the package instead.
      - name: Install build tools
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Build the distributable
        run: npm run build

      - name: Test the built verifier
        run: npm test

      # The `bin` entry point shipped for three releases without any rail ever running it:
      # 1.5.0's build died on a top-level await inside it that no test touched. Prove the
      # bytes strangers execute actually execute, in both module formats.
      - name: The published CLI runs
        run: |
          node dist/cli.cjs 2>&1 | grep -q "^usage:" || { echo "STOP: dist/cli.cjs prints no usage line"; exit 1; }
          node dist/cli.cjs inspect test/fixtures/incident-bundle.json | grep -q "^PASS" || { echo "STOP: the CJS CLI cannot read the shipped fixture"; exit 1; }
          node dist/cli.js inspect test/fixtures/incident-bundle.json | grep -q "^PASS" || { echo "STOP: the ESM CLI cannot read the shipped fixture"; exit 1; }

      # A guard that cannot fail is not a guard: prove the tarball strangers receive
      # actually contains the built code, not just the manifest.
      - name: Prove dist is inside the tarball
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          grep -q "dist/index.js" pack.log || { echo "STOP: dist/index.js is missing from the tarball"; exit 1; }
          grep -q "dist/index.d.ts" pack.log || { echo "STOP: types are missing from the tarball"; exit 1; }

      # npm will not overwrite a version, so a re-run of an already-released tag must not
      # be a failure. Publish only when the registry does not yet serve this version.
      - name: Does the registry already serve this version?
        run: |
          HAVE=$(npm view "apex-psi-verifier@$PKG" version 2>/dev/null || true)
          echo "registry has: ${HAVE:-nothing} for $PKG"
          echo "ALREADY_PUBLISHED=$([ "$HAVE" = "$PKG" ] && echo 1 || echo 0)" >> "$GITHUB_ENV"

      - name: Publish to npm
        if: env.ALREADY_PUBLISHED != '1'
        run: npm publish

      - name: Skip the publish
        if: env.ALREADY_PUBLISHED == '1'
        run: echo "apex-psi-verifier@$PKG is already on the registry; nothing to publish"

      # This guard produced the only false failure the rail has had: run 39161727540
      # published 1.3.0 successfully and then failed here, because the registry's
      # metadata cache had not caught up inside 10 seconds. A guard must wait for the
      # fact it is asserting, not for the delay it happened to sleep.
      - name: The registry must now serve this version
        run: |
          ok=0
          for i in $(seq 1 18); do
            SERVED=$(npm view apex-psi-verifier version --prefer-online 2>/dev/null || echo unknown)
            if [ "$SERVED" = "$PKG" ]; then echo "attempt $i: registry serves $SERVED"; ok=1; break; fi
            echo "attempt $i: registry still serves $SERVED, waiting"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "STOP: npm's dist-tag never moved to $PKG"
            echo "Direct registry probe:"
            curl -s -o /dev/null -w "%{http_code}\n" "https://registry.npmjs.org/apex-psi-verifier/$PKG" || true
            exit 1
          fi
          node -e "fetch('https://registry.npmjs.org/apex-psi-verifier/'+process.env.PKG).then(r=>r.json()).then(d=>{console.log('probed tarball:',d.dist.tarball,'| provenance:',!!d.dist.attestations);if(!d.version||d.version!==process.env.PKG)process.exit(1)})"

  # A deprecation is a machine-readable label on a release. Without it, a known
  # defective version stays installable and the only warning a stranger gets is
  # in the words of whoever happens to remember the defect.
  #
  # `npm deprecate` does not ride the OIDC rail - npm's own code wires the token
  # exchange into `publish` and `dist-tag` only - so the session is minted here
  # the way npm's oidc.js does it, and the deprecation is written with it. No
  # long-lived credential exists at any point.
  deprecate:
    if: startsWith(github.ref_name, 'deprecate-apex-psi-verifier-')
    runs-on: ubuntu-latest
    # Must match the "Environment name" field on the npm trusted-publisher form.
    environment: npm
    defaults:
      run:
        working-directory: packages/psi-verifier
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Mint a package session from the OIDC identity
        run: |
          set -uo pipefail
          {
            echo "### deprecate: minting a package session"
          } >> "$GITHUB_STEP_SUMMARY"
          OIDC_RESPONSE=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
          OIDC_TOKEN=$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value // empty')
          {
            echo ""
            echo "OIDC response (first 300 chars):"
            echo '```'
            printf '%s' "$OIDC_RESPONSE" | head -c 300
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error title=GitHub minted no OIDC token::$(printf '%s' "$OIDC_RESPONSE" | head -c 300 | tr '\n' ' ')"
            echo "STOP: GitHub would not mint an OIDC token for this run"
            exit 1
          fi
          EXCHANGE_RESPONSE=$(curl -sS -X POST \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/apex-psi-verifier)
          SESSION=$(printf '%s' "$EXCHANGE_RESPONSE" | jq -r '.token // empty')
          {
            echo ""
            echo "Exchange response (token removed):"
            echo '```'
            printf '%s' "$EXCHANGE_RESPONSE" | jq -c 'del(.token)' 2>/dev/null || printf '%s' "$EXCHANGE_RESPONSE" | head -c 300
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$SESSION" ]; then
            echo "::error title=npm refused the OIDC exchange::$(printf '%s' "$EXCHANGE_RESPONSE" | head -c 300 | tr '\n' ' ')"
            echo "STOP: the registry did not exchange the OIDC token for a session"
            exit 1
          fi
          echo "session minted for apex-psi-verifier"
          echo "::add-mask::${SESSION}"
          echo "SESSION=$SESSION" >> "$GITHUB_ENV"

      # Each line says what is true of that release and nothing more. A release
      # that is merely superseded says so; a release that skips a security check
      # says that.
      #
      # This is npm's own deprecate, byte for byte: GET the packument with
      # `?write=true`, set `versions[v].deprecated`, PUT the packument back.
      # The version-scoped endpoint `PUT /-/package/<pkg>/<version>` accepts the
      # write and discards it, so a 200 there proves nothing - run 43513775791
      # got 200 from it and the registry still carried no label.
      - name: Deprecate the named releases
        env:
          ENTRIES: |
            1.2.0|Security advisory: this release does not verify the seal's Ed25519 signature. Upgrade to 1.6.0.
            1.3.0|Security advisory: this release reports a declared post-quantum signature as verified without checking it. Upgrade to 1.6.0.
            1.5.0|Superseded by 1.6.0, which adds RFC 9162 consistency-proof verification (R13.2).
            0.0.0-stage|Temporary publishing placeholder, not a release. Install apex-psi-verifier@1.6.0.
        run: |
          cat > deprecate.mjs <<'EOF'
          const NAME = 'apex-psi-verifier';
          const REGISTRY = 'https://registry.npmjs.org';
          const headers = {
            'authorization': `Bearer ${process.env.SESSION}`,
            'accept': 'application/json',
            'content-type': 'application/json',
          };
          const entries = (process.env.ENTRIES || '').trim().split('\n')
            .map((line) => line.trim()).filter(Boolean)
            .map((line) => {
              const cut = line.indexOf('|');
              return { version: line.slice(0, cut), message: line.slice(cut + 1) };
            });

          const got = await fetch(`${REGISTRY}/${NAME}?write=true`, { headers });
          if (!got.ok) {
            const body = await got.text();
            console.error(`::error title=could not read the packument for writing::HTTP ${got.status} ${body.slice(0, 300).replace(/\n/g, ' ')}`);
            process.exit(1);
          }
          const packument = await got.json();
          if (!packument.versions) {
            console.error('::error title=the packument carries no versions::nothing to label');
            process.exit(1);
          }
          console.log(`packument read: ${Object.keys(packument.versions).length} versions, _rev ${packument._rev || '(none)'}`);

          const labelled = [];
          for (const { version, message } of entries) {
            if (!packument.versions[version]) {
              console.log(`  ${version}: the registry does not carry it; skipped`);
              continue;
            }
            packument.versions[version].deprecated = message;
            labelled.push(version);
          }

          const put = await fetch(`${REGISTRY}/${NAME}`, {
            method: 'PUT', headers, body: JSON.stringify(packument),
          });
          const putBody = await put.text();
          if (!put.ok) {
            console.error(`::error title=npm refused the deprecation::HTTP ${put.status} ${putBody.slice(0, 300).replace(/\n/g, ' ')}`);
            process.exit(1);
          }
          console.log(`registry accepted the update: HTTP ${put.status} ${putBody.slice(0, 120)}`);
          console.log(`labelled in this write: ${labelled.join(', ') || '(none)'}`);
          EOF
          node deprecate.mjs

      # A guard that cannot fail is not a guard: read the registry back and prove
      # the labels are actually there. The reason for a failure is published as a
      # check annotation, because step logs are not readable without admin rights
      # and a guard nobody can diagnose is half a guard.
      - name: The registry must now carry the labels
        run: |
          cat > verify.mjs <<'EOF'
          import fs from 'node:fs';
          const NAME = 'apex-psi-verifier';
          const REGISTRY = 'https://registry.npmjs.org';
          const want = ['1.2.0', '1.3.0', '1.5.0'];
          const best = ['0.0.0-stage'];
          const summary = [];

          let packument = null;
          for (let attempt = 1; attempt <= 12; attempt++) {
            const res = await fetch(`${REGISTRY}/${NAME}?cb=${attempt}`, { headers: { accept: 'application/json' } });
            if (!res.ok) {
              console.error(`::error title=could not read the packument back::HTTP ${res.status}`);
              process.exit(1);
            }
            packument = await res.json();
            const missing = want.filter((v) => !(packument.versions[v] || {}).deprecated);
            if (!missing.length) break;
            console.log(`attempt ${attempt}: still unlabelled -> ${missing.join(', ')}`);
            await new Promise((r) => setTimeout(r, 5000));
          }

          const labelled = want.filter((v) => (packument.versions[v] || {}).deprecated);
          const missing = want.filter((v) => !(packument.versions[v] || {}).deprecated);
          summary.push('### deprecate: registry state', '');
          for (const v of want) {
            const line = `- ${v} -> ${(packument.versions[v] || {}).deprecated || 'NOT LABELLED'}`;
            summary.push(line);
            console.log(line);
          }
          for (const v of best) {
            const line = `- ${v} -> ${(packument.versions[v] || {}).deprecated || 'not labelled (best effort)'}`;
            summary.push(line);
            console.log(line);
          }
          if (missing.length) {
            const msg = `STILL UNLABELLED: ${missing.join(', ')}`;
            summary.push('', msg);
            console.error(`::error title=npm did not carry the deprecation labels::${msg}`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
            process.exit(1);
          }
          console.log(`::notice title=deprecation labels confirmed::${labelled.join(', ')}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
          EOF
          node verify.mjs
